syntax = "proto3";

package leaderboard.v1;

option go_package = "github.com/joaomagfreitas/slider-proto/leaderboard/v1;leaderboard_proto_v1";

message Leaderboard {
  uint32 rank = 1;
  string player_id = 2;
  string player_name = 3;
  uint32 elo_rating = 4;
  uint64 average_completion_time_ms = 5;
  uint32 average_moves = 6;
  uint32 completed_puzzles = 8;
}

message ListGlobalLeaderboardRequest {}

message ListGlobalLeaderboardResponse { repeated Leaderboard leaderboard = 1; }

message GetPlayerLeaderboardRequest { string player_id = 1; }

message GetPlayerLeaderboardResponse { Leaderboard leaderboard = 1; }

service leaderboardService {
  rpc GetPlayerLeaderboard(GetPlayerLeaderboardRequest)
      returns (GetPlayerLeaderboardResponse);

  rpc ListGlobalLeaderboard(ListGlobalLeaderboardRequest)
      returns (ListGlobalLeaderboardResponse);
}